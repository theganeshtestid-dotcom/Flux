name: Build FLUX APK
on:
  push:
    branches: [main]
    paths-ignore: ['downloads/**', 'design/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flux-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Flutter SDK
        run: |
          set -euo pipefail
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin 737ba8f885dc774b53b442759999a312c9461e4e
          git -C "$RUNNER_TEMP/flutter" checkout --detach 737ba8f885dc774b53b442759999a312c9461e4e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Check and build
        run: |
          set -euo pipefail
          dart format lib test
          bash tool/verify.sh 2>&1 | tee build.log
      - name: Save formatting patch
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          git diff -- lib test > format.patch
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          text = Path('build.log').read_text(errors='replace') if Path('build.log').exists() else 'SDK setup stopped. See job steps.'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Build verification output\n\n````text\n' + text[-60000:] + '\n````\n')
          if os.environ['BUILD_STATUS'] != 'success':
              start = text.find('Analyzing ')
              diagnostic = text[start:] if start >= 0 else text[-20000:]
              for i in range(0, min(len(diagnostic), 24000), 2800):
                  chunk = diagnostic[i:i+2800].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=Build output {i//2800+1}::' + chunk)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FLUX-build-result
          path: |
            dist/FLUX.apk
            dist/FLUX.apk.sha256
            dist/FLUX-download.zip
            build.log
            format.patch
